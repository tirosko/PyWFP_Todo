<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuchynské poznámky | Zoznam receptov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Kuchynský zápisník</p>
                <h1>Dobré jedlo,<br><em>jednoducho uložené.</em></h1>
                <p class="hero-text">Uchovajte si obľúbené recepty na jednom príjemnom a prehľadnom mieste.</p>
            </div>
            <div class="hero-mark" aria-hidden="true">R</div>
        </header>

        <section class="recipe-form-section" aria-labelledby="add-recipe-heading">
            <div class="section-heading">
                <p class="eyebrow">Vytvorte si zbierku</p>
                <h2 id="add-recipe-heading">Pridať recept</h2>
            </div>
            <form id="recipe-form" class="recipe-form">
                <label>
                    Názov receptu
                    <input id="recipe-name" name="name" type="text" placeholder="napr. Citrónové cestoviny" required maxlength="60">
                </label>
                <label>
                    Popis
                    <textarea id="recipe-description" name="description" placeholder="Stručná poznámka o surovinách, čase prípravy alebo vašom obľúbenom vylepšení..." required maxlength="240" rows="3"></textarea>
                </label>
                <button class="add-button" type="submit">
                    <span aria-hidden="true">+</span> Pridať recept
                </button>
            </form>
        </section>

        <section class="recipe-list-section" aria-labelledby="recipe-list-heading">
            <div class="list-heading">
                <div>
                    <p class="eyebrow">Vaša zbierka</p>
                    <h2 id="recipe-list-heading">Recepty <span id="recipe-count" class="recipe-count">0</span></h2>
                </div>
                <p id="empty-message" class="empty-message">Tu sa začína váš ďalší obľúbený recept.</p>
            </div>
            <div id="undo-message" class="undo-message" role="status" hidden>
                <span>Recept bol vymazaný.</span>
                <button id="undo-delete-button" class="undo-button" type="button">Vrátiť späť</button>
            </div>
            <div id="recipe-list" class="recipe-list" aria-live="polite"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
